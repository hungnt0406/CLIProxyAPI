# Personal configuration template for CLIProxyAPI.
# Replicates the primary device's setup on a new machine.
#
# Bootstrap a new device with:
#   ./setup.sh
# Then replace every SET_ME_* value below with your real secrets.
# IMPORTANT: config.yaml is git-ignored - never commit it.
# See config.example.yaml for the full reference of every option.

# Server host/interface to bind to. Default is empty ("") to bind all interfaces (IPv4 + IPv6).
host: ""

# Server port
port: 8317

# TLS settings for HTTPS. When enabled, the server listens with the provided certificate and key.
tls:
  enable: false
  cert: ""
  key: ""

# Management API settings
remote-management:
  # Whether to allow remote (non-localhost) management access.
  allow-remote: false

  # Management key. If a plaintext value is provided here, it will be hashed on startup.
  # All management requests (even from localhost) require this key.
  secret-key: "SET_ME_MANAGEMENT_KEY"

  # Disable the bundled management control panel asset download and HTTP route when true.
  disable-control-panel: false

  # GitHub repository for the management control panel.
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# Authentication directory (supports ~ for home directory)
auth-dir: "~/.cli-proxy-api"

# API keys for authentication
api-keys:
  - "SET_ME_YOUR_DEVICE_API_KEY"

# Enable debug logging
debug: false

# Enable pprof HTTP debug server (host:port). Keep it bound to localhost for safety.
pprof:
  enable: false
  addr: "127.0.0.1:8316"

# Standard dynamic library plugins are disabled by default.
plugins:
  enabled: false
  dir: "plugins"
  configs:
    example:
      enabled: true
      priority: 1
      config1: true
      config2: "string"
      config3: 3
      mode: "safe"

# When true, disable high-overhead request logging and HTTP middleware features.
commercial-mode: false

# When true, write application logs to rotating files instead of stdout.
logging-to-file: false

# Maximum total size (MB) of log files under the logs directory.
logs-max-total-size-mb: 0

# Maximum number of error log files retained when request logging is disabled.
error-logs-max-files: 10

# When false, disable in-memory usage statistics aggregation.
usage-statistics-enabled: false

# How long (in seconds) usage queue items are retained in memory for the Management API.
redis-usage-queue-retention-seconds: 60

# Proxy URL. Supports socks5/http/https protocols.
proxy-url: ""

# When true, unprefixed model requests only use credentials without a prefix.
force-model-prefix: false

# When true, forward filtered upstream response headers to downstream clients.
passthrough-headers: false

# Number of times to retry a request (403, 408, 500, 502, 503, 504).
request-retry: 3

# Maximum number of different credentials to try for one failed request.
max-retry-credentials: 0

# Maximum wait time in seconds for a cooled-down credential before triggering a retry.
max-retry-interval: 30

# When true, disable auth/model cooldown scheduling globally.
disable-cooling: false

# When true, persist per-auth cooldown status as .cds files next to auth files.
save-cooldown-status: false

# Cooldown duration in seconds for transient upstream errors. 0 keeps the legacy 60s cooldown.
transient-error-cooldown-seconds: 0

# When true, globally disable Claude request cloaking.
disable-claude-cloak-mode: false

# disable-image-generation supports: false (default), true, "chat", or "passthrough".
disable-image-generation: false

# How long video IDs returned by /openai/v1/videos and xAI video creation stay bound
# to the credential that created them.
video-result-auth-cache-ttl: "3h"

# Quota exceeded behavior
quota-exceeded:
  switch-project: true
  switch-preview-model: true
  antigravity-credits: true

# Routing strategy for selecting credentials when multiple match.
routing:
  strategy: "fill-first"
  # Enable universal session-sticky routing for all clients.
  session-affinity: false
  # How long session-to-auth bindings are retained.
  session-affinity-ttl: "1h"

# Codex provider behavior.
codex:
  # Remap Codex prompt_cache_key and installation identity per selected auth.
  identity-confuse: false

# When true, enable authentication for the WebSocket API (/v1/ws).
ws-auth: true

# When > 0, emit blank lines every N seconds for non-streaming responses to prevent idle timeouts.
nonstream-keepalive-interval: 0

# OpenAI compatibility providers
openai-compatibility:
  - name: "openrouter"
    base-url: "https://openrouter.ai/api/v1"
    api-key-entries:
      - api-key: "sk-or-v1-SET_ME_OPENROUTER_KEY"
    models:
      - name: "deepseek/deepseek-v4-flash-0731"
        alias: "deepseek-v4-flash"
      - name: "z-ai/glm-5.3-flash"
        alias: "glm-5.3-flash"

# Optional payload configuration
payload:
  override:
    - models:
        - name: "deepseek/deepseek-v4-flash-0731"
          protocol: "openai"
      params:
        "provider.order":
          - "DeepInfra"
          - "DigitalOcean"
          - "Decart"
          - "OpenInference"
        "provider.allow_fallbacks": false
    - models:
        - name: "z-ai/glm-5.3-flash"
          protocol: "openai"
      params:
        "provider.order":
          - "Relace"
          - "Z.AI"
          - "Novita"
        "provider.allow_fallbacks": false
